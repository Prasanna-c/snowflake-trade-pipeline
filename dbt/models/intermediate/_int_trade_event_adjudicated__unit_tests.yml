        - {event_sk: 4, verdict: "REJECTED"}
        - {event_sk: 5, verdict: "REJECTED"}
        - {event_sk: 6, verdict: "REJECTED"}
        - {event_sk: 7, verdict: "REJECTED"}
        - {event_sk: 8, verdict: "ACCEPTED"}

  - name: field_rules_distinguish_malformed_from_missing
    model: int_trade_event_adjudicated
    description: >
      The distinction that makes rejection reports useful. A field that was SENT but could
      not be cast is RJ008 (malformed); a field that was NOT SENT is RJ004 (missing).
      Telling an upstream team the wrong one sends them after the wrong bug.
    overrides:
      macros:
        is_incremental: false
      vars:
        business_date: "2026-06-15"
    given:
      - input: ref('int_trade_event_typed')
        rows:
          # Sent "1,234.00", which failed to cast: notional is null AND cast_failure_count > 0.
          - {event_sk: 1, batch_seq: 1, trade_id: "TRD-000000020", trade_version: 1, action: "NEW", buy_sell: "BUY", notional_amount: null, notional_currency: "USD", settlement_currency: "USD", product_type: "FX_SPOT", counterparty_id: "CP0001", book_id: "BK-FX-LDN-01", trade_date: "2026-06-01", settlement_date: "2026-06-03", maturity_date: "2026-07-01", effective_event_ts: "2026-06-15 09:00:00", cast_failure_count: 1, uti_distinct_trade_count: 1, raw_payload: '{}'}
          # Simply absent: notional is null and cast_failure_count is 0.
          - {event_sk: 2, batch_seq: 1, trade_id: "TRD-000000021", trade_version: 1, action: "NEW", buy_sell: "BUY", notional_amount: null, notional_currency: "USD", settlement_currency: "USD", product_type: "FX_SPOT", counterparty_id: "CP0001", book_id: "BK-FX-LDN-01", trade_date: "2026-06-01", settlement_date: "2026-06-03", maturity_date: "2026-07-01", effective_event_ts: "2026-06-15 09:00:00", cast_failure_count: 0, uti_distinct_trade_count: 1, raw_payload: '{}'}
      - input: ref('ref_counterparty')
        rows:
          - {counterparty_id: "CP0001", counterparty_name: "Aldgate", is_active: true}
      - input: ref('ref_book')
        rows:
          - {book_id: "BK-FX-LDN-01", book_name: "FX Cash London", notional_limit: 250000000}
      - input: ref('ref_product')
        rows:
          - {product_type: "FX_SPOT", asset_class: "FX", is_physically_settled: true, requires_maturity: true}
      - input: ref('ref_currency')
        rows:
          - {currency_code: "USD", is_deliverable: true, minor_units: 2}
    expect:
      rows:
        # Both rejected, but with different codes. The codes are asserted rather than just
        # the verdict, so a regression that collapses the two cases into one code fails.
        #
        # Asserted through violated_rule_codes_csv rather than the array itself: a unit
        # test fixture cannot express an ARRAY on Snowflake. See the note on that column
        # in the model.
        - {event_sk: 1, verdict: "REJECTED", violated_rule_codes_csv: "RJ004,RJ008"}
        - {event_sk: 2, verdict: "REJECTED", violated_rule_codes_csv: "RJ004"}

  # =========================================================================
  # WARN SEVERITY
  # =========================================================================
  - name: warn_rules_do_not_block_acceptance
    model: int_trade_event_adjudicated
    description: >
      A trade over its book's notional limit is ACCEPTED and flagged with RJ018, not
      rejected. Rejecting it would hide the breach -- the desk would resubmit as several
      smaller tickets and risk would never see the position.
    overrides:
      macros:
        is_incremental: false
      vars:
        business_date: "2026-06-15"
    given:
      - input: ref('int_trade_event_typed')
        rows:
          - {event_sk: 1, batch_seq: 1, trade_id: "TRD-000000030", trade_version: 1, action: "NEW", buy_sell: "BUY", notional_amount: 500000000, notional_currency: "USD", settlement_currency: "USD", product_type: "FX_SPOT", counterparty_id: "CP0001", book_id: "BK-FX-LDN-01", trade_date: "2026-06-01", settlement_date: "2026-06-03", maturity_date: "2026-07-01", effective_event_ts: "2026-06-15 09:00:00", cast_failure_count: 0, uti_distinct_trade_count: 1, raw_payload: '{}'}
      - input: ref('ref_counterparty')
        rows:
          - {counterparty_id: "CP0001", counterparty_name: "Aldgate", is_active: true}
      - input: ref('ref_book')
        rows:
          - {book_id: "BK-FX-LDN-01", book_name: "FX Cash London", notional_limit: 250000000}
      - input: ref('ref_product')
        rows:
          - {product_type: "FX_SPOT", asset_class: "FX", is_physically_settled: true, requires_maturity: true}
      - input: ref('ref_currency')
        rows:
          - {currency_code: "USD", is_deliverable: true, minor_units: 2}
    expect:
      rows:
        # RJ018 appears in both by design: violated_rule_codes_csv is every code that
        # fired, warning_rule_codes_csv is that list intersected with the WARN severities.
        # Asserting both is what proves the severity split, rather than merely that
        # something fired.
        - {event_sk: 1, verdict: "ACCEPTED", version_action: "NEW", violated_rule_codes_csv: "RJ018", warning_rule_codes_csv: "RJ018"}

  # =========================================================================
  # MULTIPLE VIOLATIONS
  # =========================================================================
  - name: all_violated_rules_are_reported_not_just_the_first
    model: int_trade_event_adjudicated
    description: >
      An event with four independent defects must report all four codes. Short-circuiting
      on the first failure would make a trade capture team resubmit four times, learning
      about one new defect each time.
    overrides:
      macros:
        is_incremental: false
      vars:
        business_date: "2026-06-15"
    given:
      - input: ref('int_trade_event_typed')
        rows:
          # Unknown counterparty (RJ005), invalid currency (RJ006), zero notional (RJ007),
          # future trade date (RJ014).
          - {event_sk: 1, batch_seq: 1, trade_id: "TRD-000000040", trade_version: 1, action: "NEW", buy_sell: "BUY", notional_amount: 0, notional_currency: "XXX", settlement_currency: "XXX", product_type: "FX_SPOT", counterparty_id: "CP9999", book_id: "BK-FX-LDN-01", trade_date: "2026-12-31", settlement_date: "2027-01-04", maturity_date: "2027-06-01", effective_event_ts: "2026-06-15 09:00:00", cast_failure_count: 0, uti_distinct_trade_count: 1, raw_payload: '{}'}
      - input: ref('ref_counterparty')
        rows:
          - {counterparty_id: "CP0001", counterparty_name: "Aldgate", is_active: true}
      - input: ref('ref_book')
        rows:
          - {book_id: "BK-FX-LDN-01", book_name: "FX Cash London", notional_limit: 250000000}
      - input: ref('ref_product')
        rows:
          - {product_type: "FX_SPOT", asset_class: "FX", is_physically_settled: true, requires_maturity: true}
      - input: ref('ref_currency')
        rows:
          - {currency_code: "USD", is_deliverable: true, minor_units: 2}
    expect:
      rows:
        # The codes appear in rule-definition order, which is the order
        # array_construct_compact() emits them in.
        - {event_sk: 1, verdict: "REJECTED", violated_rule_count: 4, violated_rule_codes_csv: "RJ005,RJ006,RJ007,RJ014"}
